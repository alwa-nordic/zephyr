# This file contains the configuration for the Bluetooth
# controller. It is in a separate file so that the controller
# may be built in a separate image.

CONFIG_BT_EXT_ADV=y

CONFIG_BT_LL_SW_SPLIT=y

CONFIG_BT_BROADCASTER=y
# ZLL allow experimental flags
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
# ZLL experimental flag to allow the spec max
CONFIG_BT_CTLR_ADV_DATA_CHAIN=y
# Max allowed by spec
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=1650

CONFIG_BT_OBSERVER=y
# Max allowed by spec
CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX=1650
